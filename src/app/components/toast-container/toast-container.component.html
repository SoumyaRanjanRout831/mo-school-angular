<div class="toast-stack">
  <div
    *ngFor="let toast of toastService.toasts()"
    class="toast-item"
    [ngClass]="{
      'toast-success': toast.type === 'success',
      'toast-error': toast.type === 'error',
      'toast-warning': toast.type === 'warning',
      'toast-info': toast.type === 'info'
    }"
  >
    <div class="toast-icon-box">
      <svg *ngIf="toast.type === 'success'" class="toast-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      <svg *ngIf="toast.type === 'error'" class="toast-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      <svg *ngIf="toast.type === 'warning'" class="toast-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <svg *ngIf="toast.type === 'info'" class="toast-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <div class="toast-text-box">
      <p *ngIf="toast.title" class="toast-title">{{ toast.title }}</p>
      <p class="toast-message">{{ toast.message }}</p>
    </div>

    <button
      (click)="toastService.remove(toast.id)"
      class="toast-close-btn"
      title="Dismiss"
    >
      <svg class="toast-close-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
