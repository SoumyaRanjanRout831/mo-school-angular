<div *ngIf="student" class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-content delete-modal-box" (click)="$event.stopPropagation()">
    <!-- Warning Icon -->
    <div class="danger-icon-circle">
      <svg class="danger-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </div>

    <h3 class="delete-modal-title">Delete Student Record?</h3>
    <p class="delete-modal-desc">
      Are you sure you want to permanently delete <strong class="highlight-name">{{ student.firstName }} {{ student.lastName }}</strong> (Roll #{{ student.rollNumber }})? All student academic and contact history will be removed.
    </p>

    <div class="delete-actions-row">
      <button (click)="cancel.emit()" class="btn btn-secondary btn-cancel-delete">
        Cancel
      </button>
      <button (click)="confirm.emit(student.id)" [disabled]="isDeleting" class="btn btn-danger btn-confirm-delete">
        <span *ngIf="isDeleting" class="submit-spinner"></span>
        <span>Delete Permanently</span>
      </button>
    </div>
  </div>
</div>
