<header class="app-navbar">
  <div class="container navbar-container">
    <!-- Brand Logo -->
    <div class="brand-group">
      <div class="brand-icon">
        <svg class="brand-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M12 14l9-5-9-5-9 5 9 5z" />
          <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-name">EduPulse</h1>
        <span class="brand-tag">School Management System</span>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="navbar-actions">
      <!-- Live Server Indicator -->
      <div class="server-status-pill">
        <span class="status-pulse"></span>
        <span class="status-text">REST API Active</span>
      </div>

      <!-- Quick Action -->
      <button (click)="createStudent.emit()" class="btn btn-primary nav-cta">
        <svg class="nav-cta-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>Enroll Student</span>
      </button>
    </div>
  </div>
</header>
